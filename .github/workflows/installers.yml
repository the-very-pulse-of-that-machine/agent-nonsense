name: Desktop installers

on:
  push:
    branches: [codex/desktop-installers]
    tags: [desktop-v*]
  pull_request:
    paths:
      - agent_nonsense/**
      - packaging/**
      - pyproject.toml
      - .github/workflows/installers.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a preview release after all installers pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Package ${{ matrix.name }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-2022
          - name: linux-x64
            os: ubuntu-22.04
          - name: macos-arm64
            os: macos-15
          - name: macos-x64
            os: macos-15-intel
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils fonts-noto-cjk libgl1 libegl1 libfontconfig1 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1
      - name: Install pinned build dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Run source regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify release tag version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$GITHUB_REF_NAME" = "desktop-v$version"
      - name: Build and test self-contained packages
        run: python packaging/build_installers.py
      - name: Install, launch and uninstall the package
        run: python packaging/verify_installer.py
      - name: Upload installable packages and checksums
        uses: actions/upload-artifact@v7
        with:
          name: doupi-${{ matrix.name }}
          path: release/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.name }}
          path: |
            release/*selftest.json
            build/installed-selftest.json
            build/pyinstaller/doupi/warn-doupi.txt
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish installers
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          pattern: doupi-*
          path: release
          merge-multiple: true
      - name: Check every published asset
        working-directory: release
        run: |
          for manifest in *-SHA256SUMS.txt; do sha256sum --check "$manifest"; done
          test -n "$(find . -name '*-setup.exe' -print)"
          test -n "$(find . -name '*.deb' -print)"
          test -f Doupi-$(python -c 'import tomllib; print(tomllib.load(open("../pyproject.toml", "rb"))["project"]["version"])')-macos-arm64.dmg
          test -f Doupi-$(python -c 'import tomllib; print(tomllib.load(open("../pyproject.toml", "rb"))["project"]["version"])')-macos-x64.dmg
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [[ "$GITHUB_REF" == refs/tags/desktop-v* ]]; then
            tag="$GITHUB_REF_NAME"
            prerelease=()
          else
            tag="desktop-preview-${GITHUB_SHA:0:12}"
            prerelease=(--prerelease)
          fi
          cp packaging/RELEASE_NOTES.md build-release-notes.md
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> build-release-notes.md
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "豆皮桌面版 $version ($tag)" --notes-file build-release-notes.md "${prerelease[@]}"
          fi
          printf '[下载安装包](https://github.com/%s/releases/tag/%s)\n' "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
